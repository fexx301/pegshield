name: PegShield CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pegshield-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: 1.7.1
      - run: forge fmt --root contracts --check
      - run: forge test --root contracts
      - run: forge build --root contracts --sizes
      - run: node scripts/abi-check.mjs

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:ts:check
      - run: pnpm --recursive lint
      - run: pnpm --recursive typecheck
      - run: pnpm --recursive test
      - run: pnpm --recursive build

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:discovery
      - run: pnpm validate:proof
      - run: pnpm validate:deployments
      - name: Secret scan
        run: |
          set +e
          git grep -n -I -E '(PRIVATE_KEY[[:space:]]*=[^[:space:]]{8,}|mnemonic[[:space:]:=]|BEGIN [A-Z ]+ PRIVATE KEY)' -- ':!contracts/lib' ':!node_modules' ':!worker/dist' ':!.github/workflows/ci.yml'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "secret-like material found" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi

  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pegshield/web exec playwright install --with-deps chromium
      - run: pnpm --filter @pegshield/web build
      - run: pnpm --filter @pegshield/web e2e
