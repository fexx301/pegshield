[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "london"
ffi = false
fs_permissions = [
    { access = "read", path = "../worker/fixtures" },
    { access = "read", path = "../deployments" }
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
