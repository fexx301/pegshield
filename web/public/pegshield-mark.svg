<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="pegshield-mark-title pegshield-mark-desc" color="#38BDF8">
  <title id="pegshield-mark-title">PegShield logo</title>
  <desc id="pegshield-mark-desc">An offset circular peg held within two calibrated containment brackets.</desc>
  <!-- Change currentColor in CSS to use the mark on any solid background. -->
  <g fill="currentColor">
    <!-- Left containment bracket -->
    <path d="M220 140h170c28 0 50 22 50 50v57c-77 39-120 105-120 188v130c0 83 43 149 120 188v57c0 28-22 50-50 50H220c-28 0-50-22-50-50V190c0-28 22-50 50-50Z"/>
    <!-- Right containment bracket: a 96-unit stop plane sits 50 units from the core. -->
    <path d="M610 140h170c28 0 50 22 50 50v620c0 28-22 50-50 50H610c-28 0-50-22-50-50v-57c58-31 90-84 90-158v-17c0-13 20-17 20-30v-96c0-13-20-17-20-30v-17c0-74-32-127-90-158v-57c0-28 22-50 50-50Z"/>
    <!-- Stable asset displaced toward the calibrated stop. Gap: 50 units (one-third bracket stroke). -->
    <circle cx="540" cy="500" r="80"/>
  </g>
</svg>
